[package]
name = "fairygui-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy integration for the FairyGUI runtime: asset loading, ECS mirroring and input bridging"

[dependencies]
fairygui-core.workspace = true
fairygui-bevy-macros.workspace = true

# 使用 Bevy 默认特性集合以便开箱即用；如需裁剪，可改为
